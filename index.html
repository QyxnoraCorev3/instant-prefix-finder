<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Finder</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; border-radius: 16px; padding: 25px; width: 100%; max-width: 650px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 6px; font-size: 24px; font-weight: 700; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        .search-box { position: relative; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 14px 16px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: #38bdf8; }
        
        .stats { text-align: right; color: #64748b; font-size: 13px; margin-bottom: 12px; font-weight: 600; }
        
        .result-list { list-style: none; max-height: 480px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .result-list::-webkit-scrollbar { width: 6px; }
        .result-list::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        .card { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .card-title { font-size: 18px; font-weight: 700; color: #f8fafc; }
        .serial { color: #38bdf8; margin-right: 4px; }
        
        .availability-info { display: flex; flex-direction: column; gap: 4px; font-size: 14px; background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        .status-available { color: #22c55e; font-weight: 600; }
        .status-unavailable { color: #ef4444; font-weight: 600; }
        
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .btn { border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; color: #ffffff; transition: opacity 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-copy { background: #3b82f6; }
        .btn-web { background: #0284c7; }
        .btn-app { background: #8b5cf6; }
        .no-result { text-align: center; color: #94a3b8; padding: 20px; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Project Finder</h1>
    <p class="subtitle">Search projects by prefix to check website & app availability</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search project name (e.g., W, Waha)..." oninput="handleSearch()">
    </div>

    <div class="stats" id="statsCount">Matches Found: 0</div>
    <ul id="results" class="result-list"></ul>
</div>

<script>
    // 📂 Data Structure (১,২০০+ ডাটা একইভাবে যুক্ত করবেন)
    const projectsData = [
        {
            "id": 1183,
            "name": "Wahanahonda",
            "website": "https://www.wahanahonda.com",
            "app": "https://play.google.com/store/apps/details?id=com.wahanahonda"
        },
        {
            "id": 1211,
            "name": "WhatsApp",
            "website": "https://www.whatsapp.com",
            "app": "https://play.google.com/store/apps/details?id=com.whatsapp"
        },
        {
            "id": 1212,
            "name": "WebOnlyProject",
            "website": "https://example.com",
            "app": null
        },
        {
            "id": 1213,
            "name": "AppOnlyProject",
            "website": null,
            "app": "https://example.com/app"
        }
    ];

    function handleSearch() {
        const input = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultsList = document.getElementById('results');
        const statsCount = document.getElementById('statsCount');

        resultsList.innerHTML = '';

        if (input === '') {
            statsCount.innerText = `Total Projects: ${projectsData.length}`;
            renderList(projectsData);
            return;
        }

        // Case-Insensitive Prefix Matching
        const matchedProjects = projectsData.filter(item => 
            item.name.toLowerCase().startsWith(input)
        );

        statsCount.innerText = `Matches Found: ${matchedProjects.length}`;

        if (matchedProjects.length === 0) {
            resultsList.innerHTML = '<li class="no-result">❌ কোনো প্রজেক্ট পাওয়া যায়নি।</li>';
            return;
        }

        renderList(matchedProjects);
    }

    function renderList(list) {
        const resultsList = document.getElementById('results');
        resultsList.innerHTML = '';

        list.forEach(item => {
            const li = document.createElement('li');
            li.className = 'card';

            // Availability Indicators
            const webStatus = item.website 
                ? '🌐 Website: <span class="status-available">Available</span>' 
                : '🌐 Website: <span class="status-unavailable">Not Available</span>';
            
            const appStatus = item.app 
                ? '📱 App: <span class="status-available">Available</span>' 
                : '📱 App: <span class="status-unavailable">Not Available</span>';

            // Dynamic Action Buttons
            const webBtn = item.website 
                ? `<a href="${item.website}" target="_blank" rel="noopener noreferrer" class="btn btn-web">🌐 Open Website</a>` 
                : '';
            
            const appBtn = item.app 
                ? `<a href="${item.app}" target="_blank" rel="noopener noreferrer" class="btn btn-app">📱 Open App</a>` 
                : '';

            li.innerHTML = `
                <div class="card-title">
                    <span class="serial">${item.id}.</span> ${item.name}
                </div>
                <div class="availability-info">
                    <div>${webStatus}</div>
                    <div>${appStatus}</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-copy" onclick="copyName('${item.name}')">📋 Copy</button>
                    ${webBtn}
                    ${appBtn}
                </div>
            `;

            resultsList.appendChild(li);
        });
    }

    function copyName(text) {
        navigator.clipboard.writeText(text);
        alert('কপি হয়েছে: ' + text);
    }

    // Initial Load
    handleSearch();
</script>

</body>
</html>
