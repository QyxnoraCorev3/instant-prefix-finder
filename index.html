<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Finder</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0d1b2a, #1b263b); color: #0f172a; display: flex; justify-content: center; min-height: 100vh; padding: 30px 15px; }
        .wrapper { width: 100%; max-width: 600px; }
        
        /* Main Container Card */
        .main-card { background: #ffffff; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); overflow: hidden; }

        /* Header Area */
        .header { background: linear-gradient(135deg, #1d4ed8, #2563eb); padding: 28px 24px; color: #ffffff; position: relative; }
        .header-content { display: flex; align-items: center; gap: 16px; }
        .icon-box { background: rgba(255, 255, 255, 0.2); width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; backdrop-filter: blur(5px); }
        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .header p { color: #bfdbfe; font-size: 13px; margin-top: 2px; }

        /* Body Section */
        .body-section { padding: 24px; }

        /* Search Input Box */
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #3b82f6; font-size: 18px; }
        .search-input { width: 100%; padding: 14px 16px 14px 48px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: #f8fafc; color: #0f172a; font-size: 15px; font-weight: 500; outline: none; transition: all 0.2s ease; }
        .search-input:focus { border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        /* Results Area */
        .results-container { display: flex; flex-direction: column; gap: 16px; max-height: 480px; overflow-y: auto; padding-right: 4px; }
        .results-container::-webkit-scrollbar { width: 5px; }
        .results-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* Clean Card Design */
        .project-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: transform 0.2s, box-shadow 0.2s; }
        .project-card:hover { border-color: #cbd5e1; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08); }
        
        .project-title { font-size: 20px; font-weight: 700; color: #0f172a; margin-bottom: 16px; text-transform: capitalize; }

        /* Status Grid */
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 16px; border-bottom: 1px dashed #e2e8f0; margin-bottom: 16px; }
        .status-item { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #475569; }
        
        .status-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .status-icon.available { background: #dcfce7; color: #16a34a; }
        .status-icon.unavailable { background: #fee2e2; color: #dc2626; }
        
        .val-available { color: #16a34a; }
        .val-unavailable { color: #dc2626; }

        /* Action Buttons */
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-copy { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .btn-copy:hover { background: #dbeafe; }
        .btn-web { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .btn-web:hover { background: #2563eb; color: #ffffff; }
        .btn-app { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .btn-app:hover { background: #16a34a; color: #ffffff; }

        .no-data { text-align: center; color: #64748b; padding: 30px 0; font-size: 14px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="main-card">
        <!-- Blue Header Header -->
        <div class="header">
            <div class="header-content">
                <div class="icon-box"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div>
                    <h1>Project Finder</h1>
                    <p>Instant prefix search & status dashboard</p>
                </div>
            </div>
        </div>

        <div class="body-section">
            <!-- Search Bar -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Type prefix (e.g., W, Waha)..." oninput="handleSearch()">
            </div>

            <!-- Card Results Container -->
            <div class="results-container" id="results"></div>
        </div>
    </div>
</div>

<script>
    // 📂 Data Structure (আইডি ছাড়া ক্লিন ফরম্যাট)
    const projectsData = [
        {
            "name": "Wahanahonda",
            "website": "https://www.wahanahonda.com",
            "app": "https://play.google.com/store/apps/details?id=com.wahanahonda"
        },
        {
            "name": "Weku",
            "website": "https://weku.io",
            "app": null
        },
        {
            "name": "Welocalize",
            "website": null,
            "app": "https://example.com/app"
        }
    ];

    function handleSearch() {
        const input = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultsContainer = document.getElementById('results');

        resultsContainer.innerHTML = '';

        if (input === '') {
            renderList(projectsData);
            return;
        }

        const matchedProjects = projectsData.filter(item => 
            item.name.toLowerCase().startsWith(input)
        );

        if (matchedProjects.length === 0) {
            resultsContainer.innerHTML = '<div class="no-data">No matching projects found.</div>';
            return;
        }

        renderList(matchedProjects);
    }

    function renderList(list) {
        const resultsContainer = document.getElementById('results');
        resultsContainer.innerHTML = '';

        list.forEach(item => {
            const card = document.createElement('div');
            card.className = 'project-card';

            const webAvailable = !!item.website;
            const appAvailable = !!item.app;

            card.innerHTML = `
                <div class="project-title">${item.name}</div>

                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-icon ${webAvailable ? 'available' : 'unavailable'}">
                            <i class="fa-solid fa-globe"></i>
                        </div>
                        <div>
                            Website: <span class="${webAvailable ? 'val-available' : 'val-unavailable'}">${webAvailable ? 'Available' : 'N/A'}</span>
                        </div>
                    </div>
                    <div class="status-item">
                        <div class="status-icon ${appAvailable ? 'available' : 'unavailable'}">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                        </div>
                        <div>
                            App: <span class="${appAvailable ? 'val-available' : 'val-unavailable'}">${appAvailable ? 'Available' : 'N/A'}</span>
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-copy" onclick="copyName('${item.name}')"><i class="fa-regular fa-copy"></i> Copy Name</button>
                    ${webAvailable ? `<a href="${item.website}" target="_blank" class="btn btn-web"><i class="fa-solid fa-globe"></i> Open Website</a>` : ''}
                    ${appAvailable ? `<a href="${item.app}" target="_blank" class="btn btn-app"><i class="fa-solid fa-phone"></i> Open App</a>` : ''}
                </div>
            `;

            resultsContainer.appendChild(card);
        });
    }

    function copyName(text) {
        navigator.clipboard.writeText(text);
        alert('Copied: ' + text);
    }

    // Initial Render
    handleSearch();
</script>

</body>
</html>
