        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0d1b2a, #1b263b); color: #0f172a; display: flex; justify-content: center; min-height: 100vh; padding: 30px 15px; }
        .wrapper { width: 100%; max-width: 600px; }
        .main-card { background: #ffffff; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1d4ed8, #2563eb); padding: 28px 24px; color: #ffffff; }
        .header-content { display: flex; align-items: center; gap: 16px; }
        .icon-box { background: rgba(255, 255, 255, 0.2); width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .header-text h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
        .header-text p { font-size: 13px; opacity: 0.85; }
        .body-section { padding: 24px; }
        .search-box { position: relative; margin-bottom: 20px; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #3b82f6; font-size: 16px; }
        .search-input { width: 100%; padding: 14px 16px 14px 48px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: #f8fafc; font-size: 15px; outline: none; transition: 0.2s; }
        .search-input:focus { border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .results-container { display: flex; flex-direction: column; gap: 16px; max-height: 500px; overflow-y: auto; padding-right: 4px; }
        .results-container::-webkit-scrollbar { width: 6px; }
        .results-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .project-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; transition: 0.2s; }
        .project-card:hover { border-color: #cbd5e1; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .project-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: #1e293b; text-transform: capitalize; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 14px; border-bottom: 1px dashed #e2e8f0; margin-bottom: 14px; font-size: 13px; font-weight: 600; }
        .status-item { display: flex; align-items: center; gap: 8px; }
        .status-available { color: #16a34a; }
        .status-na { color: #dc2626; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-copy { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .btn-copy:hover { background: #dbeafe; }
        .btn-web { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .btn-app { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .no-results { text-align: center; color: #64748b; padding: 20px; font-size: 14px; }
    </style>
</head>

                    <button class="btn btn-copy" onclick="copyToClipboard('${item.name}')"><i class="fa-regular fa-copy"></i> Copy Name</button>
                    <a href="${item.website}" target="_blank" class="btn btn-web"><i class="fa-solid fa-globe"></i> Open Website</a>
                    <a href="${item.app}" target="_blank" class="btn btn-app"><i class="fa-solid fa-phone"></i> Open App</a>
                </div>
            `;
            resultsContainer.appendChild(card);
        });
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert('Copied: ' + text);
    }

    // প্রাথমিক লোড
    handleSearch();
</script>
</body>
</html>
