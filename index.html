        .result-item { background: #334155; padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }

        .item-text { font-size: 15px; }
        .serial-num { color: #94a3b8; font-weight: bold; margin-right: 8px; }
        .copy-btn { background: #22c55e; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: background 0.2s; }

        .no-result { text-align: center; color: #94a3b8; padding: 20px; }

    function searchCLI() {
        const input = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultsList = document.getElementById('results');
        const statsCount = document.getElementById('statsCount');
        resultsList.innerHTML = '';

        if (input === '') {
            statsCount.innerText = `Total Services Loaded: ${fullNamesList.length}`;
            return;
        }

        const matchedItems = [];
        fullNamesList.forEach((name, index) => {
            // শুধুমাত্র নামের শুরুতে ইনপুট মিললে ফিল্টার হবে (startsWith)
            if (name.toLowerCase().startsWith(input)) {
                matchedItems.push({ serial: index + 1, name: name });
            }
        });

        statsCount.innerText = `Matches Found: ${matchedItems.length}`;

        if (matchedItems.length === 0) {
            resultsList.innerHTML = '<li class="no-result">কোন নাম পাওয়া যায়নি!</li>';
            return;
        }

        matchedItems.forEach(item => {
            const li = document.createElement('li');
            li.className = 'result-item';
            li.innerHTML = `
                <div class="item-text">
                    <span class="serial-num">${item.serial}.</span>
                    <span>${item.name}</span>
                </div>
                <button class="copy-btn" onclick="copyText('${item.name}')">Copy</button>
            `;
            resultsList.appendChild(li);
        });
    }

    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert('কপি হয়েছে: ' + text);
    }
